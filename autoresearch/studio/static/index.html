<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <!-- the "rough ink" filter every doodle and sketched line is drawn through -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough-strong" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark" id="brandMark"></span>
      <span class="brand-name">Profile Studio</span>
    </a>
  </header>
  <main id="app" class="app" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="docDialog" class="dialog">
    <form method="dialog" class="dialog-inner">
      <header class="dialog-head">
        <h3 id="docDialogTitle"></h3>
        <button class="btn ghost" value="close" aria-label="Close">close ✕</button>
      </header>
      <div id="docDialogMeta" class="muted small mono"></div>
      <pre id="docDialogBody" class="doc-body"></pre>
    </form>
  </dialog>
  <script src="/static/doodles.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>

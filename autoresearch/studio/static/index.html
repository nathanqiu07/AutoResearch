<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile Studio</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Profile Studio</span>
    </a>
    <span class="topbar-sub">researcher profiles for the AutoResearch loop</span>
  </header>
  <main id="app" class="app" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="docDialog" class="dialog">
    <form method="dialog" class="dialog-inner">
      <header class="dialog-head">
        <h3 id="docDialogTitle"></h3>
        <button class="btn ghost" value="close" aria-label="Close">Close</button>
      </header>
      <div id="docDialogMeta" class="muted small"></div>
      <pre id="docDialogBody" class="doc-body"></pre>
    </form>
  </dialog>
  <script src="/static/app.js"></script>
</body>
</html>

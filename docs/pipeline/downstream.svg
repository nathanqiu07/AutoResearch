<text class="d" x="182" y="557">+ validity · A3: synthetic vs real</text>
<text class="m" x="182" y="574">model: sonnet (judge)</text>

<rect class="box" x="430" y="500" width="220" height="84" rx="6"/>
<text class="t" x="442" y="522">A2 probes</text>

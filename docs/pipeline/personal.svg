<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 712" width="960" height="712" role="img" aria-label="Personal-track pipeline: register, make seed pairs, collect and recheck choices, hold out a test set, run E2, fit usermodel.json.">
<style>
:root {
  --bg: #f7f8fa; --fg: #1a1f29; --muted: #5b6474; --line: #d5dae3; --lane: #eef1f5; --box: #ffffff;
  --store: #e3eefa; --store-line: #4a7ab5; --edge: #4b5363; --accent: #0f7d6e;
  --ok-bg: #d8f0e4; --ok-ink: #145a37; --built-bg: #f6e7c8; --built-ink: #6b4a0e;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --fg: #e4e8ef; --muted: #98a1b0; --line: #2c333f; --lane: #181c24; --box: #1d222b;
    --store: #172a40; --store-line: #6c9bd4; --edge: #a3acba; --accent: #3cc2ad;
    --ok-bg: #173a29; --ok-ink: #8fdcb2; --built-bg: #3d3018; --built-ink: #f0cd85; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --fg: #e4e8ef; --muted: #98a1b0; --line: #2c333f; --lane: #181c24; --box: #1d222b;
  --store: #172a40; --store-line: #6c9bd4; --edge: #a3acba; --accent: #3cc2ad;
  --ok-bg: #173a29; --ok-ink: #8fdcb2; --built-bg: #3d3018; --built-ink: #f0cd85; color-scheme: dark;
}
svg .bg { fill: var(--box); }
svg .lane { fill: var(--box); }
svg .lane.alt { fill: var(--lane); }
svg .divider { stroke: var(--line); stroke-width: 1; }
svg .ll { fill: var(--fg); font: 600 11px var(--sans); letter-spacing: 0.08em; }
svg .lw { fill: var(--muted); font: 400 11px var(--sans); }
svg .num { fill: var(--accent); font: 600 15px var(--sans); }
svg .stg { fill: var(--fg); font: 500 12px var(--mono); }
svg .box { fill: var(--box); stroke: var(--edge); stroke-width: 1.4; }
svg .box.plan { stroke-dasharray: 6 4; }
svg .store { fill: var(--store); stroke: var(--store-line); stroke-width: 1.4; }
svg .t { fill: var(--fg); font: 600 13px var(--sans); }
svg .tm { fill: var(--fg); font: 500 12.5px var(--mono); }
svg .d { fill: var(--muted); font: 400 11.5px var(--sans); }
svg .m { fill: var(--muted); font: 400 11px var(--mono); }
svg .m.out { fill: var(--fg); }
svg .chip-ok { fill: var(--ok-bg); }
svg .chip-ok-t { fill: var(--ok-ink); font: 600 11px var(--sans); }
svg .chip-built { fill: var(--built-bg); }
svg .chip-built-t { fill: var(--built-ink); font: 600 11px var(--sans); }
svg .e { fill: none; stroke: var(--edge); stroke-width: 1.4; }
svg .e.plan { stroke-dasharray: 5 4; }
svg .ah { fill: var(--edge); }
svg .el { fill: var(--muted); font: italic 400 11px var(--sans); }
</style>
<defs><marker id="aq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="960" height="712"/>
<rect class="lane alt" x="0" y="0" width="150" height="712"/>
<rect class="lane alt" x="610" y="0" width="350" height="712"/>
<text class="num" x="20" y="47">1</text>
<text class="stg" x="44" y="47">init</text>
<rect class="box" x="170" y="20" width="400" height="72" rx="6"/>
<text class="t" x="184" y="46">Register the person</text>
<text class="d" x="184" y="65">records their consent and adds the track</text>
<text class="m" x="184" y="82">trackp init · no model</text>
<rect class="chip-built" x="500" y="31" width="58" height="20" rx="10"/>
<text class="chip-built-t" x="529" y="45" text-anchor="middle">built</text>
<path class="e" d="M570,56 H638" marker-end="url(#aq)"/>
<rect class="store" x="640" y="32" width="300" height="48" rx="6"/>
<text class="m out" x="654" y="52">CONSENT.md</text>
<text class="m out" x="654" y="70">data/researchers/tracks.json</text>
<path class="e" d="M370,92 V118" marker-end="url(#aq)"/>
<text class="num" x="20" y="147">2</text>
<text class="stg" x="44" y="147">seed-pairs</text>
<rect class="box" x="170" y="120" width="400" height="72" rx="6"/>
<text class="t" x="184" y="146">Make 50 seed pairs</text>
<text class="d" x="184" y="165">two library interventions on the same scenario</text>
<text class="m" x="184" y="182">trackp seed-pairs · --llm-ideas adds paid ones</text>
<rect class="chip-built" x="500" y="131" width="58" height="20" rx="10"/>
<text class="chip-built-t" x="529" y="145" text-anchor="middle">built</text>
<path class="e" d="M570,156 H638" marker-end="url(#aq)"/>
<rect class="store" x="640" y="132" width="300" height="48" rx="6"/>
<text class="m out" x="654" y="160">seed_pairs.jsonl</text>
<path class="e" d="M370,192 V218" marker-end="url(#aq)"/>
<text class="num" x="20" y="247">3</text>
<text class="stg" x="44" y="247">record</text>
<rect class="box" x="170" y="220" width="400" height="72" rx="6"/>
<text class="t" x="184" y="246">Collect their choices</text>
<text class="d" x="184" y="265">seed pairs, plus D1–D6 decisions from loop runs</text>
<text class="m" x="184" y="282">trackp pending + record, or answer / label</text>
<rect class="chip-built" x="500" y="231" width="58" height="20" rx="10"/>
<text class="chip-built-t" x="529" y="245" text-anchor="middle">built</text>
<path class="e" d="M570,256 H638" marker-end="url(#aq)"/>
<rect class="store" x="640" y="232" width="300" height="48" rx="6"/>
<text class="m out" x="654" y="252">seed_choices.jsonl</text>
<text class="m out" x="654" y="270">labels.jsonl</text>
<path class="e" d="M370,292 V318" marker-end="url(#aq)"/>
<text class="num" x="20" y="347">4</text>
<text class="stg" x="44" y="347">recheck</text>
<rect class="box" x="170" y="320" width="400" height="72" rx="6"/>
<text class="t" x="184" y="346">Re-ask 20% after 3 days</text>
<text class="d" x="184" y="365">options reversed; the agreement rate is the noise ceiling</text>
<text class="m" x="184" y="382">trackp recheck</text>
<rect class="chip-built" x="500" y="331" width="58" height="20" rx="10"/>
<text class="chip-built-t" x="529" y="345" text-anchor="middle">built</text>
<path class="e" d="M570,356 H638" marker-end="url(#aq)"/>
<rect class="store" x="640" y="332" width="300" height="48" rx="6"/>
<text class="m out" x="654" y="360">recheck.jsonl</text>
<path class="e" d="M370,392 V418" marker-end="url(#aq)"/>
<text class="num" x="20" y="447">5</text>
<text class="stg" x="44" y="447">split</text>
<rect class="box" x="170" y="420" width="400" height="72" rx="6"/>
<text class="t" x="184" y="446">Hold out a test set</text>
<text class="d" x="184" y="465">20% of seed pairs + labels from runs after --label-cutoff</text>
<text class="m" x="184" y="482">trackp split · rest is history and val</text>
<rect class="chip-built" x="500" y="431" width="58" height="20" rx="10"/>
<text class="chip-built-t" x="529" y="445" text-anchor="middle">built</text>
<path class="e" d="M370,492 V518" marker-end="url(#aq)"/>
<text class="num" x="20" y="547">6</text>
<text class="stg" x="44" y="547">e2</text>
<rect class="box" x="170" y="520" width="400" height="72" rx="6"/>
<text class="t" x="184" y="546">E2: beat M1 on held-out choices</text>
<text class="d" x="184" y="565">selected method vs M0, M1 and the noise ceiling</text>
<text class="m" x="184" y="582">trackp e2 · offline, claude-haiku-5-5</text>
<rect class="chip-built" x="500" y="531" width="58" height="20" rx="10"/>
<text class="chip-built-t" x="529" y="545" text-anchor="middle">built</text>
<path class="e" d="M570,556 H638" marker-end="url(#aq)"/>
<rect class="store" x="640" y="532" width="300" height="48" rx="6"/>
<text class="m out" x="654" y="560">results/e2/P_&lt;slug&gt;.json</text>
<path class="e" d="M370,592 V618" marker-end="url(#aq)"/>
<text class="num" x="20" y="647">7</text>
<text class="stg" x="44" y="647">fit</text>
<rect class="box" x="170" y="620" width="400" height="72" rx="6"/>
<text class="t" x="184" y="646">Fit the user model</text>
<text class="d" x="184" y="665">selected method on history + val; held-out never used</text>
<text class="m" x="184" y="682">trackp fit --method --config --backend --model</text>
<rect class="chip-built" x="500" y="631" width="58" height="20" rx="10"/>
<text class="chip-built-t" x="529" y="645" text-anchor="middle">built</text>
<path class="e" d="M570,656 H638" marker-end="url(#aq)"/>
<rect class="store" x="640" y="632" width="300" height="48" rx="6"/>
<text class="m out" x="654" y="652">usermodel.json</text>
<text class="m out" x="654" y="670">history.jsonl</text>
</svg>

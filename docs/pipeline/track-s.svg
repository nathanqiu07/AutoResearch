<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 912" width="960" height="912" role="img" aria-label="Track S pipeline: harvest dated work with Exa, extract and check decisions, find alternatives, split at date T, gate, select, run E2, fit usermodel.json.">
<style>
:root {
  --bg: #f7f8fa; --fg: #1a1f29; --muted: #5b6474; --line: #d5dae3; --lane: #eef1f5; --box: #ffffff;
  --store: #e3eefa; --store-line: #4a7ab5; --edge: #4b5363; --accent: #0f7d6e;
  --ok-bg: #d8f0e4; --ok-ink: #145a37; --built-bg: #f6e7c8; --built-ink: #6b4a0e;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --fg: #e4e8ef; --muted: #98a1b0; --line: #2c333f; --lane: #181c24; --box: #1d222b;
    --store: #172a40; --store-line: #6c9bd4; --edge: #a3acba; --accent: #3cc2ad;
    --ok-bg: #173a29; --ok-ink: #8fdcb2; --built-bg: #3d3018; --built-ink: #f0cd85; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --fg: #e4e8ef; --muted: #98a1b0; --line: #2c333f; --lane: #181c24; --box: #1d222b;
  --store: #172a40; --store-line: #6c9bd4; --edge: #a3acba; --accent: #3cc2ad;
  --ok-bg: #173a29; --ok-ink: #8fdcb2; --built-bg: #3d3018; --built-ink: #f0cd85; color-scheme: dark;
}
svg .bg { fill: var(--box); }
svg .lane { fill: var(--box); }
svg .lane.alt { fill: var(--lane); }
svg .divider { stroke: var(--line); stroke-width: 1; }
svg .ll { fill: var(--fg); font: 600 11px var(--sans); letter-spacing: 0.08em; }
svg .lw { fill: var(--muted); font: 400 11px var(--sans); }
svg .num { fill: var(--accent); font: 600 15px var(--sans); }
svg .stg { fill: var(--fg); font: 500 12px var(--mono); }
svg .box { fill: var(--box); stroke: var(--edge); stroke-width: 1.4; }
svg .box.plan { stroke-dasharray: 6 4; }
svg .store { fill: var(--store); stroke: var(--store-line); stroke-width: 1.4; }
svg .t { fill: var(--fg); font: 600 13px var(--sans); }
svg .tm { fill: var(--fg); font: 500 12.5px var(--mono); }
svg .d { fill: var(--muted); font: 400 11.5px var(--sans); }
svg .m { fill: var(--muted); font: 400 11px var(--mono); }
svg .m.out { fill: var(--fg); }
svg .chip-ok { fill: var(--ok-bg); }
svg .chip-ok-t { fill: var(--ok-ink); font: 600 11px var(--sans); }
svg .chip-built { fill: var(--built-bg); }
svg .chip-built-t { fill: var(--built-ink); font: 600 11px var(--sans); }
svg .e { fill: none; stroke: var(--edge); stroke-width: 1.4; }
svg .e.plan { stroke-dasharray: 5 4; }
svg .ah { fill: var(--edge); }
svg .el { fill: var(--muted); font: italic 400 11px var(--sans); }
</style>
<defs><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="960" height="912"/>
<rect class="lane alt" x="0" y="0" width="150" height="912"/>
<rect class="lane alt" x="610" y="0" width="350" height="912"/>
<text class="num" x="20" y="47">1</text>
<text class="stg" x="44" y="47">harvest</text>
<rect class="box" x="170" y="20" width="400" height="72" rx="6"/>
<text class="t" x="184" y="46">Harvest his dated work</text>
<text class="d" x="184" y="65">127 kept of 1,757 found, 2020–2026; authorship checked</text>
<text class="m" x="184" y="82">Exa only, no LLM · about $1.70</text>
<rect class="chip-ok" x="500" y="31" width="58" height="20" rx="10"/>
<text class="chip-ok-t" x="529" y="45" text-anchor="middle">ran</text>
<path class="e" d="M570,56 H638" marker-end="url(#as)"/>
<rect class="store" x="640" y="32" width="300" height="48" rx="6"/>
<text class="m out" x="654" y="52">corpus/research__*.txt</text>
<text class="m out" x="654" y="70">harvest_manifest.jsonl</text>
<path class="e" d="M370,92 V118" marker-end="url(#as)"/>
<text class="num" x="20" y="147">2</text>
<text class="stg" x="44" y="147">extract</text>
<rect class="box" x="170" y="120" width="400" height="72" rx="6"/>
<text class="t" x="184" y="146">Extract his decisions</text>
<text class="d" x="184" y="165">Exa structured summary: D1–D6 decisions with quotes</text>
<text class="m" x="184" y="182">Exa only, no LLM</text>
<rect class="chip-built" x="500" y="131" width="58" height="20" rx="10"/>
<text class="chip-built-t" x="529" y="145" text-anchor="middle">built</text>
<path class="e" d="M570,156 H638" marker-end="url(#as)"/>
<rect class="store" x="640" y="132" width="300" height="48" rx="6"/>
<text class="m out" x="654" y="160">extraction/exa.jsonl</text>
<path class="e" d="M370,192 V218" marker-end="url(#as)"/>
<text class="num" x="20" y="247">3</text>
<text class="stg" x="44" y="247">check</text>
<rect class="box" x="170" y="220" width="400" height="72" rx="6"/>
<text class="t" x="184" y="246">Check each decision</text>
<text class="d" x="184" y="265">Claude keeps, fixes or drops; code verifies each quote</text>
<text class="m" x="184" y="282">claude-cli · claude-sonnet-5-5 · --max-usd</text>
<rect class="chip-built" x="500" y="231" width="58" height="20" rx="10"/>
<text class="chip-built-t" x="529" y="245" text-anchor="middle">built</text>
<path class="e" d="M570,256 H638" marker-end="url(#as)"/>
<rect class="store" x="640" y="232" width="300" height="48" rx="6"/>
<text class="m out" x="654" y="252">extraction/decisions.jsonl</text>
<text class="m out" x="654" y="270">extraction/rejected.jsonl</text>
<path class="e" d="M370,292 V318" marker-end="url(#as)"/>
<text class="num" x="20" y="347">4</text>
<text class="stg" x="44" y="347">distract</text>
<rect class="box" x="170" y="320" width="400" height="72" rx="6"/>
<text class="t" x="184" y="346">Find an alternative per decision</text>
<text class="d" x="184" y="365">decisions before T see only material from before T</text>
<text class="m" x="184" y="382">claude-sonnet-5-5, plus Exa</text>
<rect class="chip-built" x="500" y="331" width="58" height="20" rx="10"/>
<text class="chip-built-t" x="529" y="345" text-anchor="middle">built</text>
<path class="e" d="M570,356 H638" marker-end="url(#as)"/>
<rect class="store" x="640" y="332" width="300" height="48" rx="6"/>
<text class="m out" x="654" y="360">extraction/distractors.jsonl</text>
<path class="e" d="M370,392 V418" marker-end="url(#as)"/>
<text class="num" x="20" y="447">5</text>
<text class="stg" x="44" y="447">pairs</text>
<rect class="box" x="170" y="420" width="400" height="72" rx="6"/>
<text class="t" x="184" y="446">Build pairs, split at date T</text>
<text class="d" x="184" y="465">anonymised; T not chosen yet (needs ≥ 40 held-out pairs)</text>
<text class="m" x="184" y="482">no model</text>
<rect class="chip-built" x="500" y="431" width="58" height="20" rx="10"/>
<text class="chip-built-t" x="529" y="445" text-anchor="middle">built</text>
<path class="e" d="M570,456 H638" marker-end="url(#as)"/>
<rect class="store" x="640" y="432" width="300" height="48" rx="6"/>
<text class="m out" x="654" y="452">history_timesplit.jsonl</text>
<text class="m out" x="654" y="470">heldout_timesplit.jsonl</text>
<path class="e" d="M370,492 V518" marker-end="url(#as)"/>
<text class="num" x="20" y="547">6</text>
<text class="stg" x="44" y="547">gate</text>
<rect class="box" x="170" y="520" width="400" height="72" rx="6"/>
<text class="t" x="184" y="546">Gate: are the pairs guessable?</text>
<text class="d" x="184" y="565">blind judge; regenerate if over 75% guessable</text>
<text class="m" x="184" y="582">track_eval gate · claude-opus-5-5</text>
<rect class="chip-built" x="500" y="531" width="58" height="20" rx="10"/>
<text class="chip-built-t" x="529" y="545" text-anchor="middle">built</text>
<path class="e" d="M570,556 H638" marker-end="url(#as)"/>
<rect class="store" x="640" y="532" width="300" height="48" rx="6"/>
<text class="m out" x="654" y="560">gate_timesplit.jsonl</text>
<path class="e" d="M370,592 V618" marker-end="url(#as)"/>
<text class="num" x="20" y="647">7</text>
<text class="stg" x="44" y="647">select</text>
<rect class="box" x="170" y="620" width="400" height="72" rx="6"/>
<text class="t" x="184" y="646">Pick a method on history</text>
<text class="d" x="184" y="665">m2–m7; stands in while E1 has no winner</text>
<text class="m" x="184" y="682">track_eval select · claude-sonnet-5-5</text>
<rect class="chip-built" x="500" y="631" width="58" height="20" rx="10"/>
<text class="chip-built-t" x="529" y="645" text-anchor="middle">built</text>
<path class="e" d="M370,692 V718" marker-end="url(#as)"/>
<text class="num" x="20" y="747">8</text>
<text class="stg" x="44" y="747">e2</text>
<rect class="box" x="170" y="720" width="400" height="72" rx="6"/>
<text class="t" x="184" y="746">E2: beat both M1 arms</text>
<text class="d" x="184" y="765">a pair counts only if both option orders are right</text>
<text class="m" x="184" y="782">track_eval e2 · + m0_named contamination probe</text>
<rect class="chip-built" x="500" y="731" width="58" height="20" rx="10"/>
<text class="chip-built-t" x="529" y="745" text-anchor="middle">built</text>
<path class="e" d="M570,756 H638" marker-end="url(#as)"/>
<rect class="store" x="640" y="732" width="300" height="48" rx="6"/>
<text class="m out" x="654" y="760">results/track_s/E2_&lt;slug&gt;.json</text>
<path class="e" d="M370,792 V818" marker-end="url(#as)"/>
<text class="num" x="20" y="847">9</text>
<text class="stg" x="44" y="847">final</text>
<rect class="box" x="170" y="820" width="400" height="72" rx="6"/>
<text class="t" x="184" y="846">Fit the user model</text>
<text class="d" x="184" y="865">selected method on history + held-out</text>
<text class="m" x="184" y="882">track_eval final</text>
<rect class="chip-built" x="500" y="831" width="58" height="20" rx="10"/>
<text class="chip-built-t" x="529" y="845" text-anchor="middle">built</text>
<path class="e" d="M570,856 H638" marker-end="url(#as)"/>
<rect class="store" x="640" y="832" width="300" height="48" rx="6"/>
<text class="m out" x="654" y="860">usermodel.json</text>
</svg>

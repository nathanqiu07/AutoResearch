<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" height="460" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<style>.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e4e3df}.ref{stroke:#8a8984}.base{fill:#8a8984;stroke:#8a8984}.best{fill:#2a78d6;stroke:#2a78d6}.ring{stroke:#fcfcfb}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.grid{stroke:#383835}.ref{stroke:#8a8984}.base{fill:#8a8984;stroke:#8a8984}.best{fill:#3987e5;stroke:#3987e5}.ring{stroke:#1a1a19}}</style>
<rect class="bg" width="940" height="460"/>
<text class="t1" x="20" y="32" font-size="17" font-weight="600">Holm correction: the more comparisons you run, the stricter the bar for the first one</text>
<text class="t2" x="20" y="54" font-size="13">Five profiles each compared with name only. Sort the p-values; the smallest must beat 0.05/5, the next 0.05/4, and so on.</text>
<text class="t2" x="20" y="72" font-size="13">Stop at the first one that misses its bar: it and every one after it count as not significant.</text>
<line class="grid" x1="90" x2="560" y1="322.9" y2="322.9"/>
<text class="t2" x="82" y="326.9" font-size="12" text-anchor="end">0.001</text>
<line class="grid" x1="90" x2="560" y1="248.6" y2="248.6"/>
<text class="t2" x="82" y="252.6" font-size="12" text-anchor="end">0.01</text>
<line class="grid" x1="90" x2="560" y1="174.3" y2="174.3"/>
<text class="t2" x="82" y="178.3" font-size="12" text-anchor="end">0.1</text>
<line class="grid" x1="90" x2="560" y1="100.0" y2="100.0"/>
<text class="t2" x="82" y="104.0" font-size="12" text-anchor="end">1</text>
<text class="t2" x="24" y="230" font-size="12" transform="rotate(-90 24 230)" text-anchor="middle">p-value (log scale)</text>
<line class="ref" x1="96.0" x2="178.0" y1="248.6" y2="248.6" stroke-width="2" stroke-dasharray="5 3"/>
<text class="t2" x="137.0" y="242.6" font-size="11" text-anchor="middle">bar 0.01</text>
<circle class="best ring" cx="137.0" cy="322.9" r="7" stroke-width="2"/><title>Informal-writing persona: raw p = 0.0010, bar 0.0100</title>
<text class="t1" x="148.0" y="326.9" font-size="12">0.001</text>
<text class="t1" x="137.0" y="382" font-size="12" text-anchor="middle">Informal-writing</text>
<text class="t1" x="137.0" y="397" font-size="12" text-anchor="middle">persona</text>
<text class="t2" x="137.0" y="412" font-size="11" text-anchor="middle" font-style="italic">passes</text>
<line class="ref" x1="190.0" x2="272.0" y1="241.4" y2="241.4" stroke-width="2" stroke-dasharray="5 3"/>
<text class="t2" x="231.0" y="235.4" font-size="11" text-anchor="middle">bar 0.0125</text>
<circle class="best ring" cx="231.0" cy="300.5" r="7" stroke-width="2"/><title>Contrastive card: raw p = 0.0020, bar 0.0125</title>
<text class="t1" x="242.0" y="304.5" font-size="12">0.002</text>
<text class="t1" x="231.0" y="382" font-size="12" text-anchor="middle">Contrastive</text>
<text class="t1" x="231.0" y="397" font-size="12" text-anchor="middle">card</text>
<text class="t2" x="231.0" y="412" font-size="11" text-anchor="middle" font-style="italic">passes</text>
<line class="ref" x1="284.0" x2="366.0" y1="232.1" y2="232.1" stroke-width="2" stroke-dasharray="5 3"/>
<text class="t2" x="325.0" y="226.1" font-size="11" text-anchor="middle">bar 0.0167</text>
<circle class="best ring" cx="325.0" cy="265.6" r="7" stroke-width="2"/><title>Contrastive card, re-run: raw p = 0.0059, bar 0.0167</title>
<text class="t1" x="336.0" y="269.6" font-size="12">0.0059</text>
<text class="t1" x="325.0" y="382" font-size="12" text-anchor="middle">Contrastive</text>
<text class="t1" x="325.0" y="397" font-size="12" text-anchor="middle">card, re-run</text>
<text class="t2" x="325.0" y="412" font-size="11" text-anchor="middle" font-style="italic">passes</text>
<line class="ref" x1="378.0" x2="460.0" y1="219.0" y2="219.0" stroke-width="2" stroke-dasharray="5 3"/>
<text class="t2" x="419.0" y="213.0" font-size="11" text-anchor="middle">bar 0.025</text>
<circle class="base ring" cx="419.0" cy="185.7" r="7" stroke-width="2"/><title>Quote-backed contrast card: raw p = 0.0703, bar 0.0250</title>
<text class="t1" x="430.0" y="189.7" font-size="12">0.0703</text>
<text class="t2" x="419.0" y="382" font-size="12" text-anchor="middle">Quote-backed</text>
<text class="t2" x="419.0" y="397" font-size="12" text-anchor="middle">contrast card</text>
<text class="t2" x="419.0" y="412" font-size="11" text-anchor="middle" font-style="italic">misses: stop</text>
<line class="ref" x1="472.0" x2="554.0" y1="196.6" y2="196.6" stroke-width="2" stroke-dasharray="5 3"/>
<text class="t2" x="513.0" y="190.6" font-size="11" text-anchor="middle">bar 0.05</text>
<circle class="base ring" cx="513.0" cy="140.4" r="7" stroke-width="2"/><title>Persona fitted on papers: raw p = 0.2861, bar 0.0500</title>
<text class="t1" x="524.0" y="144.4" font-size="12">0.286</text>
<text class="t2" x="513.0" y="382" font-size="12" text-anchor="middle">Persona fitted</text>
<text class="t2" x="513.0" y="397" font-size="12" text-anchor="middle">on papers</text>
<text class="t2" x="513.0" y="412" font-size="11" text-anchor="middle" font-style="italic">not tested</text>
<text class="t1" x="600" y="100" font-size="13" font-weight="600">Same rule as an adjusted p-value</text>
<text class="t2" x="600" y="120" font-size="12">Multiply each raw p by the number of tests left,</text>
<text class="t2" x="600" y="136" font-size="12">never letting it fall below the one before.</text>
<text class="t2" x="600" y="152" font-size="12">Significant if the result is under 0.05.</text>
<text class="t1" x="600" y="192" font-size="12">Informal-writing persona</text>
<text class="t1" x="920" y="192" font-size="12" text-anchor="end">0.0010 × 5 = 0.005 ✓</text>
<text class="t1" x="600" y="216" font-size="12">Contrastive card</text>
<text class="t1" x="920" y="216" font-size="12" text-anchor="end">0.0020 × 4 = 0.008 ✓</text>
<text class="t1" x="600" y="240" font-size="12">Contrastive card, re-run</text>
<text class="t1" x="920" y="240" font-size="12" text-anchor="end">0.0059 × 3 = 0.018 ✓</text>
<text class="t2" x="600" y="264" font-size="12">Quote-backed contrast card</text>
<text class="t2" x="920" y="264" font-size="12" text-anchor="end">0.0703 × 2 = 0.141</text>
<text class="t2" x="600" y="288" font-size="12">Persona fitted on papers</text>
<text class="t2" x="920" y="288" font-size="12" text-anchor="end">0.2861 × 1 = 0.286</text>
<text class="t2" x="20" y="446" font-size="11">Metric: mean probability on his actual choice, each profile minus name only. Raw p from an exact permutation test over his 10 works.</text>
</svg>
